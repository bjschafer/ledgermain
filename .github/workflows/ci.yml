name: CI

"on":
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch; keep every push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks (typecheck, lint, fmt, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Vendored RefData under packages/data-pipeline/data/ is committed, so
      # install never needs to hit the network for game data.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      # Covers engine/data-pipeline/web (bun test) and apps/api (vitest +
      # Workers pool) via the root --filter '*' fan-out.
      - name: Unit tests
        run: bun run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The suite itself runs in 6-8 minutes; the rest is headroom for a cold
    # browser cache, which on its own has come within a minute of the old
    # 20-minute ceiling.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browser downloads are the least predictable thing in this job: the same
      # three engines have taken anywhere from 39s to 12m49s, and at the slow
      # end they ate enough of the budget that the suite got cancelled
      # mid-run. Cache them on the resolved Playwright version, since that is
      # what decides which browser revisions are needed.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Invoke the workspace's pinned CLI by path: on a clean runner, `bunx
      # playwright` resolves the latest registry package instead of the local
      # @playwright/test, and installs browser revisions the pinned version
      # can't find (chromium_headless_shell mismatch).
      #
      # Three engines, because layout is where they disagree: Chromium and
      # Firefox run the whole suite, WebKit only the layout sweep (see the
      # projects in playwright.config.ts).
      #
      # The apt system libraries live outside the cached directory, so they are
      # installed on every run either way; only the browser downloads are
      # skipped on a hit.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: apps/web/node_modules/.bin/playwright install-deps chromium firefox webkit

      # playwright.config.ts keys retries/reporter/webServer reuse off CI,
      # which GitHub Actions sets automatically — no manual CI=1 needed here.
      - name: Run e2e tests
        run: bun run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
