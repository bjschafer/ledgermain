<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledgermain — Pathfinder 1e Tracker</title>

    <!--
      Web app manifest so iPad/iPhone users can Add to Home Screen and get a
      standalone, app-like window. No service worker, no offline caching —
      the owner has ruled that out; this is presentation-only.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#15171c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      "black" (not "black-translucent"): the status bar stays opaque and iOS
      reserves its own space above the page, so content never draws under the
      notch/status bar and no safe-area-inset padding is needed.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ledgermain" />

    <!--
      Fallback for the case the error boundary cannot reach: the bundle never
      runs at all (asset fetch blocked, parse error). It lives in #root, which
      React clears on mount, and stays invisible for the first several seconds
      so a slow-but-healthy load never flashes it. Styles are inline and
      self-contained because a stylesheet that failed to load is one of the
      things this has to survive.
    -->
    <style>
      .boot-fallback {
        max-width: 34rem;
        margin: 15vh auto;
        padding: 1.25rem 1.5rem;
        border: 1px solid #ad8e2e;
        border-radius: 6px;
        background: #15171c;
        color: #d9d4c3;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        text-align: center;
        opacity: 0;
        animation: boot-fallback-reveal 0s linear 8s forwards;
      }
      .boot-fallback p + p {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #94907f;
      }
      @keyframes boot-fallback-reveal {
        to {
          opacity: 1;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <p>Ledgermain didn't finish loading.</p>
        <p>
          Reloading usually fixes it. If you're in a private window, or your browser blocks scripts
          and storage, try a normal window.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Cloudflare Web Analytics (cookieless, no PII). Injected only on the real
      production host so local dev, workers.dev previews, and forks never send
      beacons to this site's token. `spa: true` makes client-side route changes
      count as page views — required, since Ledgermain is a single-page app.
    -->
    <script>
      if (location.hostname === "ledgermain.whizkid.dev") {
        const s = document.createElement("script");
        s.defer = true;
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute(
          "data-cf-beacon",
          JSON.stringify({ token: "2857eb7a121e40da93ef2740bef58720", spa: true }),
        );
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
