<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2027" />
      <stop offset="1" stop-color="#15171c" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c34a" />
      <stop offset="1" stop-color="#c9a227" />
    </linearGradient>
  </defs>

  <!-- Opaque dark field: iOS/Android both need a fully opaque icon. -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Thin gilded frame, echoing the "illuminated ledger" border motif. -->
  <rect x="28" y="28" width="456" height="456" rx="40" fill="none" stroke="#8a7320" stroke-width="4" opacity="0.55" />

  <!-- Open-book / ledger glyph, centered with generous margin so iOS's own
       corner mask never clips it. -->
  <g transform="translate(256 256)">
    <path
      d="M -8 -132 C -8 -132 -60 -150 -140 -150 C -160 -150 -172 -138 -172 -120 L -172 108 C -172 126 -160 138 -140 138 C -60 138 -8 156 -8 156 Z"
      fill="url(#gold)"
    />
    <path
      d="M 8 -132 C 8 -132 60 -150 140 -150 C 160 -150 172 -138 172 -120 L 172 108 C 172 126 160 138 140 138 C 60 138 8 156 8 156 Z"
      fill="url(#gold)"
    />
    <rect x="-6" y="-140" width="12" height="292" rx="6" fill="#15171c" opacity="0.85" />

    <!-- Ledger rule lines on each page. -->
    <g stroke="#15171c" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <line x1="-140" y1="-92" x2="-40" y2="-98" />
      <line x1="-140" y1="-62" x2="-40" y2="-68" />
      <line x1="-140" y1="-32" x2="-40" y2="-38" />
      <line x1="40" y1="-98" x2="140" y2="-92" />
      <line x1="40" y1="-68" x2="140" y2="-62" />
      <line x1="40" y1="-38" x2="140" y2="-32" />
    </g>
  </g>
</svg>
